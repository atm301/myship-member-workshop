<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --org:#E8651A; --org-d:#C44F0D; --org-l:#FFF1E6; --amber:#F2A33C;
  --ink:#241a13; --body:#4a3a30; --mute:#857062; --line:#f0ded0;
  --paper:#fff; --bg:#fdf8f4; --bg2:#fbf1e8;
  --green:#1f8a62; --red:#c6453a; --blue:#2a6fb8; --deep:#2b1a10;
  --sh:0 10px 28px rgba(45,26,16,.07);
  --sh2:0 18px 44px rgba(45,26,16,.11);
  --r:16px;
}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans TC',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--body);line-height:1.8;-webkit-font-smoothing:antialiased;padding-bottom:70px}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
b,strong{color:var(--ink);font-weight:700}

/* header */
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(45,26,16,.05)}
.hd{display:flex;align-items:center;gap:14px;padding:11px 0 0;flex-wrap:wrap}
.hd h1{font-size:1.06rem;font-weight:900;color:var(--ink);line-height:1.35}
.hd .sub{font-size:.74rem;color:var(--mute);font-weight:500;display:block;margin-top:1px}
.tabs{display:flex;gap:7px;overflow-x:auto;padding:9px 0 10px;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--mute);border-radius:999px;padding:7px 15px;font-size:.84rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.16s;white-space:nowrap}
.tab-btn:hover{border-color:var(--org);color:var(--org-d)}
.tab-btn.on{background:var(--org);border-color:var(--org);color:#fff;box-shadow:0 4px 12px rgba(232,101,26,.3)}

/* sections */
.tab-section{display:none;padding:26px 0 46px;animation:fade .3s ease}
.tab-section.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.sec-tag{display:inline-block;background:var(--org-l);color:var(--org-d);border-radius:999px;padding:5px 15px;font-size:.78rem;font-weight:800;margin-bottom:11px}
.sec-title{font-size:1.78rem;font-weight:900;color:var(--ink);line-height:1.3;margin-bottom:11px;letter-spacing:-.01em}
.sec-title .em{color:var(--org)}
.lead{font-size:1rem;color:var(--body);margin-bottom:17px;max-width:62em}
.h3{font-size:1.16rem;font-weight:900;color:var(--ink);margin:30px 0 13px;padding-left:12px;border-left:5px solid var(--org);line-height:1.4}
.muted-note{font-size:.84rem;color:var(--mute);line-height:1.7}

/* hero */
.hero{background:linear-gradient(135deg,#fff8f2,#ffeedd 62%,#ffe3cd);border:1px solid var(--line);border-radius:22px;padding:30px 28px;box-shadow:var(--sh2);margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-70px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(232,101,26,.14),transparent 68%)}
.hero h2{font-size:2.05rem;font-weight:900;color:var(--ink);line-height:1.22;letter-spacing:-.02em;position:relative}
.hero h2 .em{color:var(--org)}
.hero p{margin-top:11px;font-size:1.02rem;position:relative;max-width:40em}
.hero .meta{margin-top:14px;display:flex;gap:9px;flex-wrap:wrap;position:relative}
.hero .meta span{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:.84rem;font-weight:700;color:var(--ink)}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;position:relative}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;padding:11px 22px;font-size:.93rem;font-weight:800;cursor:pointer;font-family:inherit;text-decoration:none;transition:.16s;line-height:1.3}
.btn-primary{background:var(--org);color:#fff;box-shadow:0 7px 18px rgba(232,101,26,.3)}
.btn-primary:hover{background:var(--org-d);transform:translateY(-1px)}
.btn-ghost{background:var(--paper);color:var(--org-d);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--org)}
.btn-deep{background:var(--deep);color:#fff}
.btn-sm{padding:7px 15px;font-size:.84rem}

/* cards */
.grid{display:grid;gap:13px}
.g2{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(224px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(186px,1fr))}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;box-shadow:var(--sh)}
.card h3{font-size:1rem;font-weight:900;color:var(--ink);margin-bottom:6px;display:flex;align-items:center;gap:7px;line-height:1.4}
.card p{font-size:.9rem;line-height:1.72}
.card .num{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:8px;background:var(--org-l);color:var(--org-d);font-size:.82rem;font-weight:900;flex:0 0 auto}
.card.o{border-left:5px solid var(--org)}
.card.a{border-left:5px solid var(--amber)}
.card.g{border-left:5px solid var(--green)}
.card.b{border-left:5px solid var(--blue)}
.card.x{border-left:5px solid var(--red)}
.card.dk{background:linear-gradient(135deg,var(--deep),#44291a);border:0;color:#f6e7da}
.card.dk h3{color:#fff}
.card.dk p{color:#f0ddcd}
.card.dk b{color:#ffc689}

/* table */
.tw{overflow-x:auto;border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
th{background:var(--org);color:#fff;text-align:left;padding:11px 13px;font-weight:800;white-space:nowrap;font-size:.86rem}
td{padding:11px 13px;border-top:1px solid var(--line);vertical-align:top}
tr:nth-child(even) td{background:#fffaf6}
.tw.sm table{font-size:.85rem}

/* vs */
.vs{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(272px,1fr))}
.col{border-radius:var(--r);padding:16px 19px;border:1px solid var(--line);background:var(--paper);box-shadow:var(--sh)}
.col h4{font-size:.98rem;font-weight:900;margin-bottom:9px;color:var(--ink)}
.col ul{list-style:none;display:flex;flex-direction:column;gap:7px}
.col li{font-size:.9rem;padding-left:20px;position:relative;line-height:1.65}
.col li::before{position:absolute;left:0;top:0}
.col.bad{background:#fff5f4;border-color:#f6d7d2}
.col.bad h4{color:var(--red)}
.col.bad li::before{content:'✕';color:var(--red);font-weight:900}
.col.good{background:#f3fbf7;border-color:#cdeadd}
.col.good h4{color:var(--green)}
.col.good li::before{content:'✓';color:var(--green);font-weight:900}
.col.blue{background:#f3f8fd;border-color:#d3e4f5}
.col.blue h4{color:var(--blue)}
.col.blue li::before{content:'▸';color:var(--blue);font-weight:900}

/* callout */
.callout{background:var(--org-l);border:1px solid #f7d9bf;border-left:5px solid var(--org);border-radius:13px;padding:14px 17px;margin:13px 0;font-size:.92rem;line-height:1.75}
.callout.ok{background:#f3fbf7;border-color:#cdeadd;border-left-color:var(--green)}
.callout.warn{background:#fffaf0;border-color:#f6e2b8;border-left-color:var(--amber)}
.callout.bad{background:#fff5f4;border-color:#f6d7d2;border-left-color:var(--red)}
.callout .big{font-size:1.14rem;font-weight:900;color:var(--ink)}

/* flow */
.flow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:13px 0}
.flow .n{background:var(--org);color:#fff;border-radius:11px;padding:9px 15px;font-weight:800;font-size:.87rem}
.flow .n.lite{background:var(--paper);color:var(--org-d);border:1px solid var(--line)}
.flow .ar{color:var(--org);font-weight:900}

/* poll */
.poll{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;margin:13px 0;box-shadow:var(--sh)}
.poll .pchip{display:inline-block;background:var(--org);color:#fff;border-radius:999px;padding:3px 12px;font-size:.73rem;font-weight:800;margin-bottom:8px}
.poll .pchip.g{background:var(--mute)}
.poll .q{font-size:1.04rem;font-weight:900;color:var(--ink);line-height:1.5;margin-bottom:4px}
.poll .qs{font-size:.85rem;color:var(--mute);margin-bottom:10px}
.popt{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg2);border:1.5px solid transparent;border-radius:11px;padding:11px 14px;margin-bottom:7px;cursor:pointer;font-family:inherit;font-size:.92rem;overflow:hidden;transition:.15s;color:var(--body)}
.popt:hover{border-color:var(--org)}
.popt .bar{position:absolute;left:0;top:0;bottom:0;background:rgba(232,101,26,.14);transition:width .5s}
.popt .k{position:relative;width:26px;height:26px;border-radius:50%;background:var(--paper);color:var(--org-d);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex:0 0 auto;border:1px solid var(--line)}
.popt .lb{position:relative;flex:1;line-height:1.5}
.popt .pc{position:relative;font-weight:900;color:var(--org-d);font-size:.87rem}
.popt.mine{border-color:var(--org);background:var(--org-l)}
.popt.mine .k{background:var(--org);color:#fff;border-color:var(--org)}
.poll .n{font-size:.8rem;color:var(--mute);margin-top:7px}
.ansbox{display:none;margin-top:11px;background:#f3fbf7;border:1px solid #cdeadd;border-radius:12px;padding:13px 16px}
.ansbox.show{display:block;animation:fade .3s}
.ansbox .a{font-weight:900;color:var(--green);font-size:1rem;margin-bottom:6px}
.ansbox p{font-size:.9rem;line-height:1.75}
.ansbox .ext{margin-top:8px;padding-top:8px;border-top:1px dashed #cdeadd;font-size:.86rem;color:var(--mute)}

/* fill / inputs */
.fill{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;box-shadow:var(--sh);margin:13px 0}
.fill label{display:block;font-size:.85rem;font-weight:800;color:var(--ink);margin:11px 0 5px}
.fill label:first-child{margin-top:0}
.fill input[type=text],.fill input[type=number],.fill textarea,.fill select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-family:inherit;font-size:.93rem;background:var(--bg);color:var(--ink);transition:.15s}
.fill input:focus,.fill textarea:focus,.fill select:focus{outline:0;border-color:var(--org);background:var(--paper);box-shadow:0 0 0 3px rgba(232,101,26,.1)}
.fill textarea{min-height:88px;resize:vertical;line-height:1.7}
.out{background:var(--deep);color:#ffd7b0;border-radius:12px;padding:14px 16px;font-size:.88rem;line-height:1.75;margin-top:12px;white-space:pre-wrap;word-break:break-word}
.out b{color:#fff}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--mute);border-radius:999px;padding:7px 15px;font-size:.85rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{border-color:var(--org);color:var(--org-d)}
.chip.on{background:var(--org);border-color:var(--org);color:#fff}
.chip.lite.on{background:var(--amber);border-color:var(--amber)}

/* checklist */
.chk{display:flex;align-items:flex-start;gap:11px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:8px;cursor:pointer;transition:.15s}
.chk:hover{border-color:var(--org)}
.chk.on{background:#f3fbf7;border-color:#cdeadd}
.chk input{width:19px;height:19px;accent-color:var(--org);margin-top:3px;flex:0 0 auto;cursor:pointer}
.chk .d{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--org-l);color:var(--org-d);font-weight:900;font-size:.78rem;display:flex;align-items:center;justify-content:center;margin-top:1px}
.chk .t{font-size:.92rem;font-weight:700;color:var(--ink);line-height:1.6}
.chk .t small{display:block;font-weight:400;color:var(--mute);font-size:.84rem;margin-top:2px;line-height:1.6}

/* prompt cards */
.tcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;margin-bottom:13px;box-shadow:var(--sh);transition:box-shadow .2s}
.tcard .hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.tcard h3{font-size:1.04rem;font-weight:900;color:var(--ink);line-height:1.4}
.badge{background:var(--org-l);color:var(--org-d);border-radius:999px;padding:3px 11px;font-size:.73rem;font-weight:800;white-space:nowrap}
.badge.o{background:#eef4fb;color:var(--blue)}
.badge.new{background:var(--amber);color:#4a2f06}
.badge.p{background:var(--deep);color:#ffc689}
.pbody{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-size:.88rem;line-height:1.82;white-space:pre-wrap;max-height:260px;overflow:hidden;position:relative;font-family:ui-monospace,'Noto Sans TC',monospace;color:#3d2b1f}
.prow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px}
.prow .src{margin-left:auto;font-size:.78rem;color:var(--mute)}
.ai-go{display:flex;gap:7px}
.ai-go a{font-size:.8rem;color:var(--org-d);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;background:var(--paper)}
.ai-go a:hover{border-color:var(--org)}
.upg{background:#fffaf0;border:1px solid #f6e2b8;border-left:4px solid var(--amber);border-radius:11px;padding:11px 14px;margin-top:10px;font-size:.86rem;line-height:1.75;color:#5d4420}

/* tools */
.toolgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(252px,1fr))}
.toolcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--sh);display:flex;flex-direction:column}
.toolcard .tn{font-size:.98rem;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:6px}
.toolcard .star{color:var(--amber)}
.toolcard .td{font-size:.86rem;color:var(--body);margin:6px 0 8px;line-height:1.7;flex:1}
.toolcard .tu{font-size:.76rem;color:var(--mute);word-break:break-all;margin-bottom:9px}
.toolcard .warn2{font-size:.8rem;color:#8a5a18;background:#fffaf0;border:1px solid #f6e2b8;border-radius:9px;padding:7px 10px;margin-bottom:9px;line-height:1.6}
.toolcard .go{align-self:flex-start}

/* download */
.dlgrid{display:grid;gap:13px;grid-template-columns:repeat(auto-fit,minmax(258px,1fr))}
.dl{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:9px}
.dl .ic{font-size:1.9rem;line-height:1}
.dl .nm{font-size:1rem;font-weight:900;color:var(--ink)}
.dl .ds{font-size:.86rem;color:var(--body);line-height:1.7;flex:1}
.dl .sz{font-size:.78rem;color:var(--mute)}

/* preview table */
.prev{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.prev table{min-width:460px;font-size:.84rem}
.prev th{position:sticky;top:0;z-index:1}

/* seg */
.modeseg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px}
.modeseg button{border:0;background:transparent;color:var(--mute);border-radius:999px;padding:7px 16px;font-size:.85rem;font-weight:800;cursor:pointer;font-family:inherit;transition:.15s}
.modeseg button.on{background:var(--org);color:#fff}

/* upload */
.up{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:17px 19px;box-shadow:var(--sh)}
.up .lb2{display:block;font-size:.85rem;font-weight:800;color:var(--ink);margin-bottom:5px}
.up select,.up textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 13px;font-family:inherit;font-size:.93rem;background:var(--bg);color:var(--ink)}
.up textarea{min-height:108px;resize:vertical;line-height:1.7}
.dropz{border:2px dashed var(--line);border-radius:13px;padding:24px 16px;text-align:center;cursor:pointer;font-size:.92rem;color:var(--mute);transition:.15s;background:var(--bg)}
.dropz:hover,.dropz.has{border-color:var(--org);background:var(--org-l);color:var(--org-d)}
.dropz small{font-size:.8rem;display:inline-block;margin-top:5px;line-height:1.6}
.subitem{display:flex;gap:11px;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:12px 15px;margin-bottom:9px;box-shadow:var(--sh)}
.subitem .vN{flex:0 0 auto;background:var(--org-l);color:var(--org-d);border-radius:9px;padding:3px 10px;font-size:.76rem;font-weight:800;height:fit-content}
.subitem .body{flex:1;min-width:0}
.subitem .who2{font-size:.78rem;color:var(--mute);margin-bottom:4px}
.subitem .txt{font-size:.88rem;white-space:pre-wrap;word-break:break-word;line-height:1.7}
.subitem img{max-width:100%;border-radius:10px;margin-top:5px}

/* board */
.mboard{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(132px,1fr))}
.mb{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:13px;text-align:center;box-shadow:var(--sh)}
.mb .pt{font-size:1.6rem;font-weight:900;color:var(--org-d);line-height:1.2}
.mb .sm{font-size:.8rem;color:var(--mute);font-weight:700}
.pill-live{display:inline-flex;align-items:center;gap:5px;background:#f3fbf7;color:var(--green);border:1px solid #cdeadd;border-radius:999px;padding:3px 11px;font-size:.74rem;font-weight:800;margin-left:7px;vertical-align:middle}

/* who */
.who{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:11px 15px;box-shadow:var(--sh);flex-wrap:wrap;font-size:.9rem}
.who .g{font-weight:900;color:var(--org-d)}
.who button{margin-left:auto;border:1px solid var(--line);background:var(--bg);color:var(--mute);border-radius:999px;padding:5px 13px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit}

/* bars demo */
.bars{display:flex;align-items:flex-end;gap:9px;height:150px;padding:10px 6px 0;border-bottom:2px solid var(--line)}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar2{width:100%;max-width:46px;background:var(--line);border-radius:7px 7px 0 0;transition:height .5s}
.bar2.hl{background:var(--org)}
.bnum{font-size:.78rem;font-weight:800;color:var(--mute)}
.bnum.hl{color:var(--org-d);font-size:.92rem}
.blb{font-size:.76rem;color:var(--mute);font-weight:700}

/* list of sources */
.srcs{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.84rem;color:var(--mute)}
.srcs li{padding-left:16px;position:relative;line-height:1.7}
.srcs li::before{content:'·';position:absolute;left:4px;font-weight:900;color:var(--org)}
.srcs a{color:var(--org-d)}

/* footer */
footer{background:var(--deep);color:#e8d5c4;padding:28px 0;margin-top:34px;font-size:.87rem;line-height:1.8}
footer b{color:#fff}
footer .fl{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px}
footer a{color:#ffc689;text-decoration:none;font-weight:700}
footer a:hover{text-decoration:underline}

/* hud */
.hud{position:fixed;right:15px;bottom:15px;z-index:45;background:var(--deep);color:#fff;border-radius:16px;padding:11px 16px;box-shadow:0 12px 30px rgba(45,26,16,.3);cursor:pointer;display:none;align-items:center;gap:11px;min-width:168px}
.hud.show{display:flex}
.hud .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.14);border-radius:0 0 16px 16px;overflow:hidden}
.hud .bar i{display:block;height:100%;background:var(--amber);transition:width .4s}
.hud .gp{font-weight:900;font-size:.92rem}
.hud .gp small{display:block;font-weight:400;font-size:.76rem;opacity:.8}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(43,26,16,.62);backdrop-filter:blur(3px);z-index:60;display:none;align-items:center;justify-content:center;padding:18px}
.overlay.show{display:flex}
.modal{background:var(--paper);border-radius:22px;padding:26px 24px;max-width:440px;width:100%;box-shadow:0 24px 60px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
.modal h2{font-size:1.3rem;font-weight:900;color:var(--ink);margin-bottom:6px}
.modal .sub{font-size:.9rem;color:var(--mute);margin-bottom:15px;line-height:1.7}
.modal label{display:block;font-size:.85rem;font-weight:800;color:var(--ink);margin:11px 0 5px}
.modal input,.modal select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-family:inherit;font-size:.96rem;background:var(--bg);color:var(--ink)}
.modal input:focus,.modal select:focus{outline:0;border-color:var(--org);background:var(--paper)}
.modal .err{display:none;color:var(--red);font-size:.84rem;margin-top:7px;font-weight:700}
.modal .skip{display:block;text-align:center;margin-top:11px;font-size:.84rem;color:var(--mute);text-decoration:none}

/* toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(14px);background:var(--deep);color:#fff;padding:11px 22px;border-radius:999px;font-weight:800;font-size:.9rem;opacity:0;transition:.24s;z-index:70;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}

/* tier result */
.tiers{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:13px}
.tier{border-radius:14px;padding:15px 17px;color:#fff;box-shadow:var(--sh)}
.tier.vip{background:linear-gradient(135deg,#E8651A,#F2A33C)}
.tier.rep{background:linear-gradient(135deg,#F2A33C,#f7c070)}
.tier.sleep{background:linear-gradient(135deg,#4a3a30,#6b5547)}
.tier .nm{font-size:.86rem;font-weight:800;opacity:.92}
.tier .big2{font-size:2rem;font-weight:900;line-height:1.15}
.tier .dt{font-size:.82rem;opacity:.92;margin-top:3px;line-height:1.6}
.riskbox{background:#fff5f4;border:1px solid #f6d7d2;border-left:5px solid var(--red);border-radius:13px;padding:14px 17px;margin-top:13px}
.riskbox h4{font-size:.98rem;font-weight:900;color:var(--red);margin-bottom:7px}
.idlist{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.idlist span{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:.82rem;font-weight:700;color:var(--ink)}

@media(max-width:640px){
  .hero{padding:24px 20px;border-radius:18px}
  .hero h2{font-size:1.62rem}
  .sec-title{font-size:1.46rem}
  .hd h1{font-size:.98rem}
  .wrap{padding:0 16px}
  .tier .big2{font-size:1.7rem}
}
@media print{
  header,.tabs,.hud,#toast,.hero-btns,.prow{display:none!important}
  .tab-section{display:block!important;page-break-after:always}
  body{background:#fff;padding:0}
}
